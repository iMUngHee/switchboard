name: release

# A version tag publishes the release archives. Cutting one is a person's
# decision: push a tag such as v1.0.0 on a commit main's CI passed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Pinned by commit in the one job that holds a write token; the token is
      # kept out of .git/config, and nothing is restored from a cache.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: the tag is a version
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] ||
            { echo "::error::$GITHUB_REF_NAME is not a version tag such as v1.2.3"; exit 1; }
      - run: go vet ./... && go test -count=1 ./...
      - run: make release VERSION="$GITHUB_REF_NAME"
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*.tar.gz dist/*.zip dist/SHA256SUMS
          --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
