name: ci

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  # Native tests with the race detector, which needs CGO; the runners ship a C
  # toolchain on all three systems.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: make fmt-check
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      # The plan's criterion rows for this system must pass here, every part
      # of them: a skipped subtest would pass the line above unseen.
      - name: criterion tests run, not skip
        shell: bash
        run: |
          set -eu
          tests="TestCLIEndToEnd TestGracefulShutdownDuringRound"
          if [ "$RUNNER_OS" = Windows ]; then tests="TestCLIEndToEnd TestForcedEndDuringRound"; fi
          for t in $tests; do
            out=$(go test ./cmd/switchboard -run "^$t\$" -count=1 -v) || { echo "$out"; exit 1; }
            echo "$out" | grep -E -- '--- (PASS|SKIP|FAIL)'
            echo "$out" | grep -q "^--- PASS: $t " || { echo "::error::$t did not pass"; exit 1; }
            if echo "$out" | grep -q -- '--- SKIP'; then echo "::error::$t skipped a part"; exit 1; fi
          done
      # No private pattern file exists in CI, so this checks the generic rules.
      - run: go run ./tools/hygiene

  # Real mail both ways between two real pager stores through the round
  # engine, the far store behind an exec endpoint.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -tags e2e -count=1 -v ./internal/e2e

  # The same through the ssh preset, to an sshd on localhost whose sessions
  # get the far store's database through SetEnv; then no far waiter may be
  # left once the test's daemon has stopped.
  ssh-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: start an sshd on localhost
        run: |
          set -eu
          test -x /usr/sbin/sshd || { sudo apt-get update -q && sudo apt-get install -y -q openssh-server; }
          d="$RUNNER_TEMP/sshd"
          mkdir -p "$d" "$RUNNER_TEMP/far"
          chmod 700 "$d"
          ssh-keygen -q -t ed25519 -N '' -f "$d/host_key"
          ssh-keygen -q -t ed25519 -N '' -f "$d/client_key"
          cp "$d/client_key.pub" "$d/authorized_keys"
          chmod 600 "$d/authorized_keys"
          far_db="$RUNNER_TEMP/far/b.db"
          cat > "$d/sshd_config" <<EOF
          Port 2222
          ListenAddress 127.0.0.1
          HostKey $d/host_key
          AuthorizedKeysFile $d/authorized_keys
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          UsePAM yes
          StrictModes no
          PidFile $d/sshd.pid
          SetEnv PAGER_DB=$far_db PAGER_WAKE=off PAGER_CLIENT=none
          EOF
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -f "$d/sshd_config" -E "$d/sshd.log"
          {
            echo "SWITCHBOARD_E2E_SSH_PORT=2222"
            echo "SWITCHBOARD_E2E_SSH_KEY=$d/client_key"
            echo "SWITCHBOARD_E2E_FAR_DB=$far_db"
          } >> "$GITHUB_ENV"
      # The check below must see a waiter that is there, or its pass means nothing.
      - name: the far-waiter check sees a waiter
        run: |
          bash -c 'sleep 60; : relay wait' &
          planted=$!
          sleep 1
          found=$(pgrep -f 'relay wait' || true)
          kill "$planted"
          [ -n "$found" ] || { echo "::error::the check missed a planted waiter"; exit 1; }
      - run: go test -tags e2e -count=1 -v ./internal/e2e
      # The test's daemon has stopped; its waits on the far side must have ended
      # with it, on stdin's end, rather than run out their timeout.
      - name: no far waiter is left
        run: |
          sleep 15
          if pgrep -af 'relay wait'; then echo "::error::a relay wait outlived the daemon"; exit 1; fi
      - name: sshd log
        if: failure()
        run: sudo cat "$RUNNER_TEMP/sshd/sshd.log"

  # The ssh preset from Windows: ssh.exe to an OpenSSH Server on this runner,
  # whose default shell is Git Bash since the far shell must be POSIX. The far
  # side is this machine; what is under test is the client half, ssh.exe
  # carrying a held stdin and ending with the daemon. A Git Bash wrapper gives
  # the far pager its store.
  windows-ssh-e2e:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: start an sshd on localhost
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ossh = 'C:\Windows\System32\OpenSSH'
          $bash = 'C:\Program Files\Git\bin\bash.exe'
          Write-Host "sshd present: $(Test-Path "$ossh\sshd.exe")"
          if (-not (Test-Path "$ossh\sshd.exe")) {
            Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0 | Out-Null
          }
          & "$ossh\ssh.exe" -V
          # A first start writes the host keys and the default configuration.
          Set-Service sshd -StartupType Manual
          Start-Service sshd
          Stop-Service sshd
          New-Item -Path HKLM:\SOFTWARE\OpenSSH -Force | Out-Null
          New-ItemProperty -Path HKLM:\SOFTWARE\OpenSSH -Name DefaultShell -Value $bash -PropertyType String -Force | Out-Null
          New-ItemProperty -Path HKLM:\SOFTWARE\OpenSSH -Name DefaultShellCommandOption -Value '-c' -PropertyType String -Force | Out-Null

          $d = Join-Path $env:RUNNER_TEMP 'sshd'
          $far = Join-Path $env:RUNNER_TEMP 'far'
          New-Item -ItemType Directory -Force $d, $far | Out-Null
          $key = Join-Path $d 'client_key'
          $posix = { param($w) (& $bash -c "cygpath -u '$w'").Trim() }
          & $bash -c "ssh-keygen -q -t ed25519 -N '' -f '$(& $posix $key)'"
          if ($LASTEXITCODE -ne 0) { throw "ssh-keygen failed" }
          icacls $key /inheritance:r /grant:r "$($env:USERNAME):F" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "icacls on the client key failed" }
          $auth = 'C:\ProgramData\ssh\administrators_authorized_keys'
          Copy-Item "$key.pub" $auth -Force
          icacls $auth /inheritance:r /grant 'Administrators:F' /grant 'SYSTEM:F' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "icacls on authorized keys failed" }
          $cfg = @(
            'Port 2222',
            'ListenAddress 127.0.0.1',
            'PubkeyAuthentication yes',
            'PasswordAuthentication no',
            'KbdInteractiveAuthentication no',
            'Match Group administrators',
            '  AuthorizedKeysFile __PROGRAMDATA__/ssh/administrators_authorized_keys'
          ) -join "`n"
          [IO.File]::WriteAllText('C:\ProgramData\ssh\sshd_config', "$cfg`n")
          Start-Service sshd

          # The pager the test runs, built here so the far wrapper can name it.
          $ver = (Select-String -Path internal\testenv\testenv.go -Pattern 'const PagerVersion = "([0-9a-f]+)"').Matches[0].Groups[1].Value
          $env:GOBIN = Join-Path $env:RUNNER_TEMP 'pager'
          $env:CGO_ENABLED = '0'
          go install "github.com/iMUngHee/pager/cmd/pager@$ver"
          if ($LASTEXITCODE -ne 0) { throw "go install pager failed" }
          $pager = Join-Path $env:GOBIN 'pager.exe'
          $db = Join-Path $far 'b.db'
          $wrapper = Join-Path $far 'pager'
          $lines = @(
            '#!/bin/bash',
            "export PAGER_DB='$($db -replace '\\', '/')' PAGER_WAKE=off PAGER_CLIENT=none",
            "exec '$(& $posix $pager)' `"`$@`""
          ) -join "`n"
          [IO.File]::WriteAllText($wrapper, "$lines`n")
          $farPager = & $posix $wrapper
          Get-Content $wrapper

          # ssh.exe through Git Bash to the far pager, as the link will.
          $kh = Join-Path $d 'known_hosts'
          $out = & "$ossh\ssh.exe" -p 2222 -i $key -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o "UserKnownHostsFile=$kh" 127.0.0.1 "uname -s; $farPager help | grep -c 'wait --peer'"
          if ($LASTEXITCODE -ne 0) { throw "ssh to the local sshd failed" }
          Write-Host "far side: $($out -join ' / ')"
          if (-not ($out[0] -match 'MINGW|MSYS')) { throw "the far shell is not Git Bash" }
          if ($out[1] -ne '1') { throw "the far pager has no relay wait" }

          "$ossh" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          @(
            "SWITCHBOARD_E2E_SSH_PORT=2222",
            "SWITCHBOARD_E2E_SSH_KEY=$key",
            "SWITCHBOARD_E2E_FAR_DB=$db",
            "SWITCHBOARD_E2E_FAR_PAGER=$farPager",
            "SWITCHBOARD_TEST_PAGER=$pager"
          ) | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: the far-waiter check sees a waiter
        shell: pwsh
        run: |
          $planted = Start-Process pwsh -ArgumentList '-NoProfile', '-Command', 'Start-Sleep 60 # relay wait' -PassThru -WindowStyle Hidden
          Start-Sleep 2
          $found = @(Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match 'relay wait' })
          Stop-Process -Id $planted.Id -Force
          if ($found.Count -eq 0) { throw "the check missed a planted waiter" }
      - name: the ssh client is Windows OpenSSH
        shell: pwsh
        run: |
          $src = (Get-Command ssh).Source
          Write-Host "ssh on PATH: $src"
          if ($src -ne 'C:\Windows\System32\OpenSSH\ssh.exe') { throw "the link would not use Windows OpenSSH" }
      - run: go test -tags e2e -count=1 -v ./internal/e2e
      - name: no far waiter is left
        shell: pwsh
        run: |
          Start-Sleep 15
          $left = @(Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match 'relay wait' })
          $left | Format-List ProcessId, Name, CommandLine
          if ($left.Count -gt 0) { throw "a relay wait outlived the daemon" }
      - name: sshd events
        if: failure()
        shell: pwsh
        run: Get-WinEvent -LogName 'OpenSSH/Operational' -MaxEvents 40 -ErrorAction SilentlyContinue | Format-List TimeCreated, Message

  # The real service, installed as the runner's user: it must carry mail,
  # hold its link, and leave nothing behind when uninstalled.
  service-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: a user systemd
        if: runner.os == 'Linux'
        run: |
          set -eu
          sudo loginctl enable-linger "$USER"
          uid=$(id -u)
          for _ in $(seq 30); do [ -S "/run/user/$uid/bus" ] && break; sleep 1; done
          [ -S "/run/user/$uid/bus" ] || echo "::warning::no user bus came up; the Linux smoke test will skip"
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" >> "$GITHUB_ENV"
      # Linux may lack a user systemd and skip; Windows always has Task
      # Scheduler, so a skip there is a failure.
      - name: install, carry, uninstall
        shell: bash
        env:
          SWITCHBOARD_SERVICE_SMOKE: "1"
        run: |
          set -o pipefail
          go test -tags smoke -count=1 -v -run '^TestServiceSmoke$' ./cmd/switchboard 2>&1 | tee smoke.log
          if [ "$RUNNER_OS" = Windows ] && grep -q -- '--- SKIP' smoke.log; then echo "::error::the smoke test skipped"; exit 1; fi

  # Plan step 4: can a console-less switchboard run as a Task Scheduler task
  # for the runner's user, stay up, and start console children without opening
  # windows? The spike heartbeats into a log and records each child's console.
  windows-spike:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build
        run: |
          go build -o sb.exe ./cmd/switchboard
          go build -ldflags=-H=windowsgui -o sbw.exe ./cmd/switchboard
      - name: install, observe, uninstall
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'spike.log'
          $here = (Get-Location).Path
          & .\sb.exe spike install --name switchboard-spike --exe "$here\sbw.exe" --child "$here\sb.exe" --log $log
          if ($LASTEXITCODE -ne 0) { throw "install failed" }
          $xml = schtasks /Query /TN switchboard-spike /XML | Out-String
          if ($xml -notmatch '<ExecutionTimeLimit>PT0S</ExecutionTimeLimit>') { throw "the task has a time limit" }
          Start-Sleep -Seconds 30
          $lines = @(Get-Content $log)
          $beats = @($lines | Where-Object { $_ -like 'heartbeat*' }).Count
          $consoles = @($lines | Where-Object { $_ -like 'console*' })
          $failed = @($lines | Where-Object { $_ -like 'child failed*' })
          Write-Host "heartbeats=$beats children=$($consoles.Count) values=$($consoles -join ', ') failures=$($failed -join '; ')"
          if ($beats -lt 20) { throw "too few heartbeats: the task did not stay up" }
          if ($failed.Count -gt 0) { throw "a console child failed" }
          if ($consoles.Count -lt 3) { throw "too few console children ran" }
          if (@($consoles | Where-Object { $_ -ne 'console 0' }).Count -gt 0) { throw "a console child got a console window" }
          if (-not (Get-Process sbw -ErrorAction SilentlyContinue)) { throw "the daemon is not running" }
          & .\sb.exe spike uninstall --name switchboard-spike
          if ($LASTEXITCODE -ne 0) { throw "uninstall failed" }
          Start-Sleep -Seconds 3
          if (Get-Process sbw -ErrorAction SilentlyContinue) { throw "the daemon outlived its task" }
          schtasks /Query /TN switchboard-spike 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "the task is still registered" }
          exit 0
      # Whatever failed above, leave no task or daemon behind, and show the log.
      - name: clean up
        if: always()
        shell: pwsh
        run: |
          schtasks /End /TN switchboard-spike 2>$null | Out-Null
          schtasks /Delete /TN switchboard-spike /F 2>$null | Out-Null
          Get-Process sbw -ErrorAction SilentlyContinue | Stop-Process -Force
          $log = Join-Path $env:RUNNER_TEMP 'spike.log'
          if (Test-Path $log) { Get-Content $log -Tail 40 }
          exit 0

  # The release archives a tag would publish, built and checked on every push:
  # every target, every file, the notices, the checksums and the version.
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make release VERSION=v0.0.0-ci
      - name: check the archives
        run: |
          set -eu
          cd dist
          ls -l
          [ "$(ls *.tar.gz *.zip | wc -l)" -eq 6 ] || { echo "::error::want 6 archives"; exit 1; }
          [ "$(wc -l < SHA256SUMS)" -eq 6 ] || { echo "::error::SHA256SUMS must list all 6"; exit 1; }
          sha256sum -c SHA256SUMS
          for a in *.tar.gz *.zip; do
            case "$a" in
              *.zip) n=${a%.zip}; list=$(unzip -Z1 "$a"); want="switchboard.exe switchboardw.exe" ;;
              *) n=${a%.tar.gz}; list=$(tar -tzf "$a"); want="switchboard" ;;
            esac
            for f in $want LICENSE README.md THIRD_PARTY_NOTICES; do
              echo "$list" | grep -qFx "$n/$f" || { echo "::error::$a lacks $f"; exit 1; }
            done
          done
          tar -xzf switchboard-v0.0.0-ci-linux-amd64.tar.gz
          ./switchboard-v0.0.0-ci-linux-amd64/switchboard version | grep -qx 'switchboard v0.0.0-ci'
          for c in "Go (runtime and standard library)" "golang.org/x/sys" "github.com/pelletier/go-toml/v2"; do
            grep -qF "$c" switchboard-v0.0.0-ci-linux-amd64/THIRD_PARTY_NOTICES || { echo "::error::the notices lack $c"; exit 1; }
          done
