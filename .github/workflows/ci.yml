name: ci

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  # Native tests with the race detector, which needs CGO; the runners ship a C
  # toolchain on all three systems.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: make fmt-check
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      # No private pattern file exists in CI, so this checks the generic rules.
      - run: go run ./tools/hygiene

  # Real mail both ways between two real pager stores through the round
  # engine, the far store behind an exec endpoint.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -tags e2e -count=1 -v ./internal/e2e

  # The same through the ssh preset, to an sshd on localhost whose sessions
  # get the far store's database through SetEnv.
  ssh-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: start an sshd on localhost
        run: |
          set -eu
          test -x /usr/sbin/sshd || { sudo apt-get update -q && sudo apt-get install -y -q openssh-server; }
          d="$RUNNER_TEMP/sshd"
          mkdir -p "$d" "$RUNNER_TEMP/far"
          chmod 700 "$d"
          ssh-keygen -q -t ed25519 -N '' -f "$d/host_key"
          ssh-keygen -q -t ed25519 -N '' -f "$d/client_key"
          cp "$d/client_key.pub" "$d/authorized_keys"
          chmod 600 "$d/authorized_keys"
          far_db="$RUNNER_TEMP/far/b.db"
          cat > "$d/sshd_config" <<EOF
          Port 2222
          ListenAddress 127.0.0.1
          HostKey $d/host_key
          AuthorizedKeysFile $d/authorized_keys
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          UsePAM yes
          StrictModes no
          PidFile $d/sshd.pid
          SetEnv PAGER_DB=$far_db PAGER_WAKE=off PAGER_CLIENT=none
          EOF
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -f "$d/sshd_config" -E "$d/sshd.log"
          {
            echo "SWITCHBOARD_E2E_SSH_PORT=2222"
            echo "SWITCHBOARD_E2E_SSH_KEY=$d/client_key"
            echo "SWITCHBOARD_E2E_FAR_DB=$far_db"
          } >> "$GITHUB_ENV"
      - run: go test -tags e2e -count=1 -v ./internal/e2e
      - name: sshd log
        if: failure()
        run: sudo cat "$RUNNER_TEMP/sshd/sshd.log"

  # Plan step 4: can a console-less switchboard run as a Task Scheduler task
  # for the runner's user, stay up, and start console children without opening
  # windows? The spike heartbeats into a log and records each child's console.
  windows-spike:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        run: |
          go build -o sb.exe ./cmd/switchboard
          go build -ldflags=-H=windowsgui -o sbw.exe ./cmd/switchboard
      - name: install, observe, uninstall
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'spike.log'
          $here = (Get-Location).Path
          & .\sb.exe spike install --name switchboard-spike --exe "$here\sbw.exe" --child "$here\sb.exe" --log $log
          if ($LASTEXITCODE -ne 0) { throw "install failed" }
          $xml = schtasks /Query /TN switchboard-spike /XML | Out-String
          if ($xml -notmatch '<ExecutionTimeLimit>PT0S</ExecutionTimeLimit>') { throw "the task has a time limit" }
          Start-Sleep -Seconds 30
          $lines = @(Get-Content $log)
          $beats = @($lines | Where-Object { $_ -like 'heartbeat*' }).Count
          $consoles = @($lines | Where-Object { $_ -like 'console*' })
          $failed = @($lines | Where-Object { $_ -like 'child failed*' })
          Write-Host "heartbeats=$beats children=$($consoles.Count) values=$($consoles -join ', ') failures=$($failed -join '; ')"
          if ($beats -lt 20) { throw "too few heartbeats: the task did not stay up" }
          if ($failed.Count -gt 0) { throw "a console child failed" }
          if ($consoles.Count -lt 3) { throw "too few console children ran" }
          if (@($consoles | Where-Object { $_ -ne 'console 0' }).Count -gt 0) { throw "a console child got a console window" }
          if (-not (Get-Process sbw -ErrorAction SilentlyContinue)) { throw "the daemon is not running" }
          & .\sb.exe spike uninstall --name switchboard-spike
          if ($LASTEXITCODE -ne 0) { throw "uninstall failed" }
          Start-Sleep -Seconds 3
          if (Get-Process sbw -ErrorAction SilentlyContinue) { throw "the daemon outlived its task" }
          schtasks /Query /TN switchboard-spike 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "the task is still registered" }
          exit 0
      # Whatever failed above, leave no task or daemon behind, and show the log.
      - name: clean up
        if: always()
        shell: pwsh
        run: |
          schtasks /End /TN switchboard-spike 2>$null | Out-Null
          schtasks /Delete /TN switchboard-spike /F 2>$null | Out-Null
          Get-Process sbw -ErrorAction SilentlyContinue | Stop-Process -Force
          $log = Join-Path $env:RUNNER_TEMP 'spike.log'
          if (Test-Path $log) { Get-Content $log -Tail 40 }
          exit 0

  # Pure-Go release builds for every target, including the console-less
  # Windows daemon.
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make dist
