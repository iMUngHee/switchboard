name: ci

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  # Native tests with the race detector, which needs CGO; the runners ship a C
  # toolchain on all three systems.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: make fmt-check
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      # No private pattern file exists in CI, so this checks the generic rules.
      - run: go run ./tools/hygiene

  # Pure-Go release builds for every target, including the console-less
  # Windows daemon.
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make dist
